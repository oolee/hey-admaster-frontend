<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta name="description" content="A Modern Back-end Management System" />
    <meta name="keywords" content="Vben Admin Vue3 Vite" />
    <meta name="author" content="Vben" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />
    <!-- 由 vite 注入 VITE_APP_TITLE 变量，在 .env 文件内配置 -->
    <title>%VITE_APP_TITLE%</title>
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <div id="app-loading">
      <style>
        #app-loading {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: var(--color-bg, #0f0d0b);
          transition: opacity 0.3s ease;
        }
        #app-loading.is-hidden { opacity: 0; pointer-events: none; }
        #app-loading .al-logo {
          width: 44px; height: 44px; border-radius: 12px;
          background: linear-gradient(140deg, var(--color-accent, #ff8a5c), #4f8fd6);
          display: flex; align-items: center; justify-content: center;
          font-size: 20px; font-weight: 700; color: #fff;
          margin-bottom: 16px;
        }
        #app-loading .al-spin {
          width: 22px; height: 22px;
          border: 2px solid var(--color-border-strong, rgba(255,255,255,0.2));
          border-top-color: var(--color-accent, #ff8a5c);
          border-radius: 50%;
          animation: al-rot 0.7s linear infinite;
        }
        @keyframes al-rot { to { transform: rotate(360deg); } }
      </style>
      <div class="al-logo">19</div>
      <div class="al-spin"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
